<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Microcontroller body -->
  <rect x="5" y="3" width="14" height="12" rx="1.5" stroke="currentColor" stroke-width="1.5" fill="none"/>
  <!-- Pins left -->
  <line x1="2" y1="6" x2="5" y2="6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="2" y1="9" x2="5" y2="9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="2" y1="12" x2="5" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Pins right -->
  <line x1="19" y1="6" x2="22" y2="6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="19" y1="9" x2="22" y2="9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="19" y1="12" x2="22" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Warning triangle -->
